[project]
name = "payments"
version = "0.1.0"
description = "Async payment processing service"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Rakhat Zhumaev", email = "livencor@gmail.com" },
]
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "dishka>=1.10.1",
    "dishka-faststream>=0.7.0",
    "fastapi>=0.141.1",
    "faststream[rabbit]>=0.7.5",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
dev = [
    "mypy>=1.16.0",
    "pre-commit>=4.3.0",
    "ruff>=0.11.12",
    { include-group = "test" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = [
    "E501",
    "A002",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "PLR2004", "SLF001"]
"migrations/**" = ["INP001", "N999"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require PostgreSQL via DATABASE_URL",
]
addopts = [
    "-q",
]
